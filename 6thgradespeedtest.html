<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>6th Grade</title>
    </head>
    <body>
        <style>
            body {
                background-color:darkslategray;
                margin: 0;

            }
            #welcomingtext {
                color: antiquewhite;
                text-align: center;
            }
            #topcontent {
                background-color: rgba(58, 55, 55, 0.357);
                position: absolute;
                Width: 100%;
                height: 20vh;
                
            }
            .questionbuttons {
                border: 2px solid black;
                background-color: white;
                width: 20vh;
                height: 30vh;
                position: absolute;
                top: 10vh;
                right: 20vh;
            }
            #restart {
                background-color: crimson;
                border-color: black;
                border-radius: 5px;
                width: 10vh;
                height: 20px;
                position: absolute;
                top: 20px;
                right: 50px;
                
                
            }
            #question {
                background-color: blanchedalmond;
                position: absolute;
                border-style: solid;
                border-width: 5px;
                text-align: center;
                top: 5px;
                height: 50px;

                width: 95%;

            }
            #timerbox {
                position: absolute;
                top: 10px;
                right: 150px;


                background-color: orange;
                border-radius: 50%;
                width: 50px;
                height: 50px;
                text-align: center;
            }
            #maincontent {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 80vh;
                position: absolute;
                top: 20vh;
                background-color: blue;
                right: 0%;

            }
            #answers {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 30px;
                width: 90%;
                height: 95%;
                border-style: solid;
                border-width: 3px;
                top: 80px;
            }
            .answer {
                border-radius: 10px;
                border-width: 5px;
                height: 30vh;
                width: 70vh;
                position: absolute;
                top: 0px;
            }
            #answer1 {
                border: 2px solid black;
                position: relative;

            }

        </style>


        <div id="topcontent">
            <h1 id="welcomingtext">Welcome to the 6th grade speed test.</h1>
            <div class="questionsbuttons">
                <button id="back"><strong>Back</strong></button>
                <button id="restart"><strong>Restart</strong></button>
                <button id="skip"><strong>Skip</strong></button>
            </div>
            
            <div id="timerbox">
                <p id="time">0</p>
            </div>

        </div>
 
        <div id="maincontent">
            <div id="question">
                <p>1</p>
            </div>
            <div id="answers">
                <div id="answer1" class="answer">
                    <button id="actualanswer1">answer1</button>
                </div>
                <div id="answer2" class="answer">
                    <p>3</p>
                </div>

            </div>

        </div>
        <script>
            let restartbutton = document.getElementById("restart");
            let quizing = 1;
            let question = 1;
            let time = 0;

            setInterval(function() {
                time++;

            document.getElementById("time").textContent = time;
            }, 1000);

            

        </script>
    </body>
